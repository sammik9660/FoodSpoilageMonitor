<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font:16px system-ui;background:#f3f5f6;color:#172b36;max-width:1500px;margin:32px auto;padding:0 18px}
#devices{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
section.device{min-width:0;background:white;padding:20px;margin:0;border-radius:12px}button,a{padding:10px;display:inline-block;margin:4px}
@media(min-width:760px){#devices{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1200px){#devices{grid-template-columns:repeat(3,minmax(0,1fr))}}
input{padding:10px;max-width:90%}pre{white-space:pre-wrap;font-size:14px}.error{color:#b42318}.values{font-size:22px}
.battery-chart{width:100%;height:150px;background:#f8fafb;border:1px solid #d8e0e4;border-radius:8px}.muted{color:#526773;font-size:14px}
[hidden]{display:none!important}
</style></head><body>
<h1>Food Spoilage Monitor</h1><details><summary>원격 업데이트 관리 인증</summary><label>관리 토큰 <input id="remoteToken" type="password" autocomplete="off" maxlength="64" onkeydown="if(event.key==='Enter'){event.preventDefault();saveRemoteToken()}"></label><button type="button" onclick="saveRemoteToken()">토큰 확인·이 브라우저에 저장</button><button type="button" onclick="clearRemoteToken()">저장된 토큰 삭제</button><p id="remoteTokenStatus" role="status" class="muted">저장을 선택하면 이 브라우저에만 남습니다. 공용 PC에서는 저장하지 마세요.</p></details><p id="loading">Loading devices…</p><div id="devices"></div>
<script>
const refreshMs=<?= refreshMs ?>,base='<?= webAppUrl ?>';
const panels=new Map(),polling=new Set(),remoteCatalog=new Map(),pollFailures=new Map();let deviceListBusy=false,listRetryAt=0,listFailures=0;
const remoteTokenStorageKey='foodmonitor.remote.operator.v1';
function remoteTokenStatus(message,error=false){const s=document.getElementById('remoteTokenStatus');s.textContent=message;s.className=error?'error':'muted';}
function saveRemoteToken(){
 const token=document.getElementById('remoteToken').value.trim();
 if(!/^[a-fA-F0-9]{64}$/.test(token)){remoteTokenStatus('64자리 관리 토큰을 입력하세요.',true);return;}
 google.script.run.withSuccessHandler(()=>{
  try{if(typeof localStorage==='undefined')throw Error('storage unavailable');localStorage.setItem(remoteTokenStorageKey,token);remoteTokenStatus('관리 토큰을 확인하고 이 브라우저에 저장했습니다.');}
  catch(_){remoteTokenStatus('인증은 성공했지만 브라우저 저장이 차단됐습니다. 이 탭에서는 입력한 토큰을 계속 사용할 수 있습니다.',true);}
 }).withFailureHandler(e=>remoteTokenStatus('관리 토큰 확인 실패: '+String(e&&e.message||e),true)).getRemoteUpdateCatalog(token);
}
function clearRemoteToken(){
 try{if(typeof localStorage!=='undefined')localStorage.removeItem(remoteTokenStorageKey);}catch(_){}
 document.getElementById('remoteToken').value='';remoteTokenStatus('이 브라우저의 저장된 관리 토큰을 삭제했습니다.');
}
function restoreRemoteToken(){
 try{const token=typeof localStorage==='undefined'?'':localStorage.getItem(remoteTokenStorageKey);if(token&&/^[a-fA-F0-9]{64}$/.test(token)){document.getElementById('remoteToken').value=token;remoteTokenStatus('이 브라우저에 저장한 관리 토큰을 불러왔습니다.');}}catch(_){}
}
function panelMarkup(id,index){return `<section class="device" id="panel-${id}"><h2>Device ${index+1} · ${id}</h2>
  <strong id="state-${id}">WAITING / UNKNOWN</strong><p id="integrity-${id}" class="error" hidden></p><p id="measurement-${id}">Measurement mode: unknown</p><p id="age-${id}">No confirmed sample</p><p id="updated-${id}">Last update: unknown</p><div class="values" id="values-${id}">—</div><p id="gas-${id}">No valid gas sample</p><p id="battery-${id}">BAT --</p>
  <details><summary>배터리 이력</summary><p><button onclick="loadBatteryHistory('${id}','24h')">최근 24시간</button><button onclick="loadBatteryHistory('${id}','7d')">최근 7일</button><button onclick="loadBatteryHistory('${id}','all')">전체</button></p><p id="batteryHistoryStatus-${id}" class="muted">이력 조회 전</p><p>배터리 전압 (실측)</p><svg id="batteryVoltageChart-${id}" class="battery-chart" viewBox="0 0 760 150" role="img" aria-label="배터리 전압 이력"></svg><p>배터리 잔량 (센서 추정)</p><svg id="batteryPercentChart-${id}" class="battery-chart" viewBox="0 0 760 150" role="img" aria-label="배터리 추정 잔량 이력"></svg></details>
<p>Values are live telemetry, not a food-safety verdict. Stale values remain labeled as stale.</p>
  <h3 id="recording-${id}">실험 상태 확인 중</h3><h2 id="sessionName-${id}">실험 기록 없음</h2><p id="sessionDate-${id}"></p><details id="sessionDetails-${id}" hidden><summary>세션 ID 보기</summary><small id="sessionId-${id}"></small></details>
  <input id="label-${id}" maxlength="120" placeholder="새 실험 이름" aria-label="${id} 장치의 새 실험 이름">
  <button id="start-${id}" onclick="control('${id}',true)">새 실험 시작</button><button id="stop-${id}" onclick="control('${id}',false)">실험 종료</button><p id="message-${id}" role="status"></p>
  <h3>데이터 다운로드</h3><p>페이지당 최대 10,000행입니다. 데이터가 더 있으면 다음 페이지 번호를 선택해 추가 데이터를 다운로드하세요.</p><label>다운로드 페이지 <input id="page-${id}" type="number" min="1" step="1" value="1" aria-label="${id} 장치 CSV 페이지" onchange="csvLinks('${id}')"></label>
  <p><a id="sessionCsv-${id}" hidden target="_blank" rel="noopener">최근 실험 데이터 다운로드 (CSV)</a><a id="all-${id}" href="${base}?download=csv" target="_blank" rel="noopener">장치 전체 데이터 다운로드 (CSV)</a></p>
  <p>측정 시각을 기준으로 실험 데이터를 구분합니다. 실험 종료 후 늦게 도착한 데이터도 해당 실험에 포함될 수 있습니다. 측정 시각이 불명확한 데이터는 별도로 분류됩니다.</p>
  <h3>Firmware</h3><p id="firmware-${id}">Version: unknown</p><p id="ota-${id}">OTA: unavailable</p><p class="muted">현장 복구 링크는 스마트폰과 게이트웨이가 같은 LAN에 있을 때만 열립니다. 인터넷 원격 업데이트는 아래에서 진행합니다.</p><a id="espOtaLink-${id}" hidden target="_blank" rel="noopener">현장 복구: ESP32 OTA — gateway firmware</a><a id="nrfDfuLink-${id}" hidden target="_blank" rel="noopener">현장 복구: nRF52840 DFU — sensor firmware</a><p id="localLinkStatus-${id}" class="muted"></p>
<details><summary>인터넷 원격 업데이트 (다른 Wi-Fi·모바일 데이터 가능)</summary><p>등록된 HTTPS 패키지를 ESP32가 직접 내려받습니다. 브라우저가 로컬 IP에 접속할 필요는 없습니다.</p><p>최초 장치 키 설정은 같은 LAN에서 아래 현장 복구 페이지의 <b>Remote update provisioning</b> 링크로 이동합니다. 주소를 외울 필요가 없으며, 다른 Wi-Fi에서는 이 로컬 페이지에 접속할 수 없습니다.</p><p id="remotePrereq-${id}" class="muted">장치 상태 확인 중</p>
  <button onclick="loadRemoteCatalog('${id}')">패키지 목록 불러오기</button><select id="remoteRelease-${id}" aria-label="원격 업데이트 패키지"></select>
  <label><input id="remoteRollback-${id}" type="checkbox"> ESP32 이전 버전/빌드로 복구 승인</label>
  <button id="remoteStart-${id}" onclick="approveRemoteUpdate('${id}')" disabled>선택 장치 업데이트 승인</button>
  <p id="remoteState-${id}">원격 상태 확인 중</p><progress id="remoteProgress-${id}" max="100" value="0"></progress><p id="remoteMessage-${id}" role="status"></p><details><summary>최근 업데이트 결과</summary><pre id="remoteHistory-${id}"></pre></details></details>
<h3>Diagnostics</h3><p id="transport-${id}">Wi-Fi / BLE / cloud ACK: unknown</p><pre id="health-${id}">Waiting for gateway heartbeat</pre></section>`;}
function el(id,suffix){return document.getElementById(suffix+'-'+id);}
function csvLinks(id){const page=Math.max(1,Math.floor(Number(el(id,'page').value)||1)),offset=(page-1)*10000,session=panels.get(id)?.sessionId||'';
 el(id,'all').href=base+'?download=csv&offset='+offset+'&limit=10000&device='+encodeURIComponent(id);
 el(id,'sessionCsv').href=base+'?download=csv&offset='+offset+'&limit=10000&session='+encodeURIComponent(session)+'&device='+encodeURIComponent(id);}
function deviceError(message){const loading=document.getElementById('loading');loading.textContent=message;loading.className='error';}
function koreanDateTime(value){if(typeof value!=='number'||!Number.isFinite(value))return '';return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'numeric'}).format(new Date(value));}
function chartSvg(points,key,min,max){
 const valid=points.filter(p=>Number.isFinite(p[key])&&Number.isFinite(p.measured_at));if(!valid.length)return '<text x="20" y="75" fill="#526773">기록 없음</text>';
 const first=valid[0].measured_at,last=valid[valid.length-1].measured_at,span=Math.max(1,last-first),segments=[];let current=[];
 for(const p of valid){if(current.length&&p.measured_at-current[current.length-1].measured_at>900000){segments.push(current);current=[];}current.push(p);}if(current.length)segments.push(current);
 const lines=segments.map(s=>'<polyline fill="none" stroke="#087f5b" stroke-width="2" points="'+s.map(p=>`${20+720*(p.measured_at-first)/span},${130-110*(Math.max(min,Math.min(max,p[key]))-min)/(max-min)}`).join(' ')+'"/>').join('');
 return `<text x="4" y="16" fill="#526773">${max}</text><text x="4" y="138" fill="#526773">${min}</text>${lines}`;
}
function renderBatteryHistory(id,data){const points=Array.isArray(data.points)?data.points:[];
 el(id,'batteryVoltageChart').innerHTML=chartSvg(points,'battery_mv',2500,4300);
 el(id,'batteryPercentChart').innerHTML=chartSvg(points,'battery_percent',0,100);
 const last=data.last_received_at?new Date(data.last_received_at).toLocaleString():'없음';
 el(id,'batteryHistoryStatus').textContent=`${data.range} · ${data.total||0}개 기록 · 마지막 수신 ${last}${data.downsampled?' · 표시용 실제 점 일부 선택':''}`;}
function loadBatteryHistory(id,range){el(id,'batteryHistoryStatus').textContent='배터리 이력 조회 중…';google.script.run.withSuccessHandler(d=>renderBatteryHistory(id,d)).withFailureHandler(e=>{el(id,'batteryHistoryStatus').textContent='배터리 이력 오류: '+String(e.message||e);}).getBatteryHistory(id,range);}
function renderDevices(list){
 if(!Array.isArray(list)||list.some(x=>!x||typeof x.device_id!=='string'||!/^(legacy|[a-f0-9]{12})$/.test(x.device_id))){deviceError('CLOUD ERROR: Invalid device list response');return;}
 const root=document.getElementById('devices'),ids=list.map(x=>x.device_id);
 for(const id of panels.keys())if(!ids.includes(id)){document.getElementById('panel-'+id)?.remove();panels.delete(id);}
 ids.forEach((id,index)=>{if(!panels.has(id)){root.insertAdjacentHTML('beforeend',panelMarkup(id,index));panels.set(id,{sessionId:null});loadBatteryHistory(id,'24h');}pollDevice(id);});
 const loading=document.getElementById('loading');loading.textContent=ids.length?'':'No devices registered yet';loading.className='';}
function show(id,d){el(id,'state').textContent=d.state;const h=d.health||{};
 el(id,'state').title=d.progress_reason||'';
 const integrity=el(id,'integrity');integrity.hidden=!d.integrity_reason;integrity.textContent=d.integrity_reason||'';
 const modes={ENV:'Environment sampling',GAS:'HP-354 gas scan',COOL:'Cooling / settling',REC:'Sensor recovery',LEGACY:'Legacy gas stream'};
 el(id,'measurement').textContent='Measurement mode: '+(modes[h.sensor_mode]||'unknown')+(d.progress_reason?' · '+d.progress_reason:'');
 el(id,'age').textContent=d.age===null?'Last environment sample: unknown':'Last environment sample: '+(d.age/1000).toFixed(1)+' s ago';
 el(id,'updated').textContent=d.age===null?'Last update: unknown':'Last update: '+new Date(d.server_time-d.age).toLocaleString();
 const v=h.environment||(!h.sensor_mode||h.sensor_mode==='LEGACY'?h.latest:null);
 el(id,'values').textContent=v?`${v.t.toFixed(2)} °C · ${v.h.toFixed(2)} % · ${v.p.toFixed(2)} hPa`:'No valid environment sample';
 const gasAge=h.last_valid_age_ms!=null&&h.server_seen_at!=null?h.last_valid_age_ms+d.server_time-h.server_seen_at:null;
 el(id,'gas').textContent=h.latest&&h.latest.g>0&&gasAge!=null?`Last valid gas: ${h.latest.g.toFixed(2)} kΩ · ${(gasAge/1000).toFixed(0)} s ago`:'No valid gas sample';
 const battery=el(id,'battery');
 if(h.usb_power===true)battery.textContent=Number.isFinite(h.battery_last_percent)?`BAT USB · last ${Math.round(h.battery_last_percent)}%`:'BAT USB';
 else if(h.battery_measurement_valid===true&&Number.isFinite(h.battery_mv)){
   const pct=Number.isFinite(h.battery_percent)?` · ${Math.round(h.battery_percent)}%`:'';
   battery.textContent=`BAT ${(h.battery_mv/1000).toFixed(2)} V${pct}`;
 } else battery.textContent='BAT --';
 const cal=h.battery_calibration_state||'상태 정보 없음',min=Number.isFinite(h.battery_min_mv)?(h.battery_min_mv/1000).toFixed(2)+' V':'--',max=Number.isFinite(h.battery_max_mv)?(h.battery_max_mv/1000).toFixed(2)+' V':'--';
 battery.title=h.usb_power===true&&Number.isFinite(h.battery_last_percent)?
   `USB 연결 중에는 현재 배터리 전압을 측정할 수 없습니다. ${Math.round(h.battery_last_percent)}%는 마지막 배터리 단독 추정치입니다.`:
   `잔량은 전압 기반 추정치 · 보정 ${cal} · 관측 ${min}–${max}`;
 const r=d.recording,active=r.state==='RECORDING',stopped=r.state==='STOPPED',sessionId=active?r.session_id:r.download_session_id,label=active?r.experiment_label:r.download_experiment_label,startedAt=active?r.started_at:r.download_started_at;
 el(id,'recording').textContent=active?'실험 기록 중':stopped?'실험 종료됨':'실험 상태 확인 불가';
 el(id,'sessionName').textContent=label||'실험 기록 없음';el(id,'sessionDate').textContent=startedAt?'실험 시작: '+koreanDateTime(startedAt):'';
 const details=el(id,'sessionDetails');details.hidden=!sessionId;el(id,'sessionId').textContent=sessionId||'';
 const updating=h.ota_state==='UPDATING'||h.ota_state==='VERIFYING',recordingKnown=r.state==='RECORDING'||r.state==='STOPPED';
 el(id,'start').disabled=!recordingKnown||r.state==='RECORDING'||updating;el(id,'stop').disabled=!recordingKnown||r.state!=='RECORDING';
 panels.get(id).sessionId=r.download_session_id;const link=el(id,'sessionCsv');link.hidden=!r.download_session_id;
 link.textContent=r.download_kind==='CURRENT'?'현재 실험 데이터 다운로드 (CSV)':'최근 실험 데이터 다운로드 (CSV)';csvLinks(id);
 const seen=h.server_seen_at?new Date(h.server_seen_at).toLocaleString():'unknown',ackAge=h.gateway_uptime_ms&&h.last_ack_ms?((h.gateway_uptime_ms-h.last_ack_ms)/1000).toFixed(1)+' s at last contact':'unknown';
 el(id,'firmware').textContent='Version: '+(h.firmware_version||'unknown');
 el(id,'ota').textContent='OTA: '+(h.ota_state||'unknown');
 const remote=d.remote_update||{state:'IDLE'};
 const contactFresh=Number.isFinite(h.server_seen_at)&&d.server_time-h.server_seen_at<90000;
 el(id,'remotePrereq').textContent=!contactFresh?'장치의 최근 클라우드 응답이 없어 원격 명령을 보낼 수 없습니다.':
  h.remote_capable!==true?'이 게이트웨이의 원격 수신기 또는 장치 키·HTTPS 저장소 설정이 확인되지 않았습니다. 최초 설정은 같은 LAN의 관리 페이지에서 수행합니다.':
  !remote.authenticated?'장치와 클라우드의 원격 명령 키가 일치하는 인증된 heartbeat를 기다리는 중입니다.':
  !stopped?'실험을 종료하고 기존 미전송 데이터를 비운 뒤 업데이트할 수 있습니다.':'원격 인증 완료. 릴리스 목록을 불러와 대상과 버전을 확인하세요.';
 const remoteStates={IDLE:'대기',QUEUED:'명령 전달 대기',RECEIVED:'장치가 명령을 받음',PREPARING:'기존 데이터 전송 대기',DOWNLOADING:'HTTPS 다운로드',VERIFYING:'이미지/부팅 확인',UPDATING:'펌웨어 기록/DFU 전송',RECONNECTING:'센서 재연결·버전·측정 확인',SUCCESS:'업데이트 검증 성공',FAILED:'업데이트 실패',UNCONFIRMED:'장치 결과 미확인'};
 el(id,'remoteState').textContent=(!remote.authenticated?'인증된 장치 응답 대기 · ':'')+(remoteStates[remote.state]||remote.state)+(remote.version?' · '+remote.kind+' '+remote.version:'')+(remote.error?' · '+remoteErrorMessage(remote.error):'')+(remote.updated_at?' · 마지막 보고 '+new Date(remote.updated_at).toLocaleString():'');
 el(id,'remoteHistory').textContent=(remote.history||[]).map(x=>x.kind+' '+x.version+' · '+x.state+(x.error?' · '+x.error:'')).join('\n')||'이전 결과 없음';
 if(remote.peer)el(id,'remoteState').textContent+=' · ESP '+remote.peer.firmware+' / '+remote.peer.build+' · nRF '+(remote.peer.sensor_version||'확인 불가');
 el(id,'remoteProgress').value=remote.percent||0;
 el(id,'remoteStart').disabled=!stopped||!contactFresh||h.remote_capable!==true||remote.reserved||!remoteCatalog.has(id)||!remote.authenticated;
 if(remote.reserved)el(id,'start').disabled=true;
 const espOtaLink=el(id,'espOtaLink'),nrfDfuLink=el(id,'nrfDfuLink');const ip=typeof h.local_ip==='string'&&/^(?:10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.)\d{1,3}\.\d{1,3}$/.test(h.local_ip);
 espOtaLink.hidden=nrfDfuLink.hidden=!ip;if(ip){const local='http:'+'/'+'/'+h.local_ip+':8080';espOtaLink.href=local+'/';nrfDfuLink.href=local+'/nrf-dfu';}
 el(id,'localLinkStatus').textContent=!ip?'현장 복구 주소는 최근 게이트웨이 보고가 없습니다.':
  contactFresh?'현장 복구는 같은 LAN에서만 접속됩니다.':'마지막 보고된 로컬 주소입니다. 공유기가 바뀌었다면 현재 주소와 다를 수 있습니다.';
 espOtaLink.title=nrfDfuLink.title=contactFresh?'같은 LAN에서만 열립니다.':'마지막 보고된 로컬 IP입니다. 현재 주소가 바뀌었을 수 있습니다.';
 el(id,'transport').textContent=`Wi-Fi: ${h.wifi_connected_ms?'connected at gateway uptime '+Math.round(h.wifi_connected_ms/1000)+' s':'unknown'} · BLE: ${h.ble_connected===true?'connected':h.ble_connected===false?'disconnected':'unknown'} · cloud ACK age: ${ackAge} · last cloud contact: ${seen}`;
 el(id,'health').textContent=JSON.stringify(h,null,2);}
function remoteErrorMessage(code){const reasons={
 LOCAL_UPDATE_BUSY:'다른 업데이트 또는 로컬 안전 조건 확인 필요',TARGET_NOT_PAIRED:'명시적으로 페어링한 센서가 아님',PREPARATION_STOPPED:'준비가 중단됨: STOPPED·클라우드·Wi-Fi·spool 확인',COMMAND_EXPIRED:'명령 유효 시간 만료',CLOUD_STOPPED_UNCONFIRMED:'클라우드에서 실험 종료 상태를 확인하지 못함',SPOOL_RESERVE_SPACE:'spool 보호 공간을 제외한 저장 공간 부족',DOWNLOAD_AUTH:'파일 저장소 인증 실패',DOWNLOAD_NOT_FOUND:'저장소에서 파일을 찾을 수 없음',DOWNLOAD_TLS_OR_CONNECT:'저장소 연결 또는 TLS 인증서 확인 실패',DOWNLOAD_REDIRECT_REJECTED:'저장소의 리다이렉트 거부',HTTP_RANGE_OR_SIZE:'다운로드 범위 또는 파일 크기 불일치',DOWNLOAD_INTERRUPTED:'다운로드 연결 중단',DOWNLOAD_TIMEOUT:'다운로드 시간 초과',DOWNLOAD_OFFLINE:'Wi-Fi 연결 끊김',IMAGE_HASH:'파일 SHA-256 불일치',MANIFEST_HASH:'manifest SHA-256 불일치',SIGNED_MANIFEST_REJECTED:'서명·버전·manifest 검증 거부',OTA_WRITE:'OTA 슬롯 쓰기 실패',PACKAGE_WRITE:'DFU 임시 파일 쓰기 실패',IMAGE_COMMIT:'이미지 검증 또는 부팅 슬롯 선택 실패',DFU_PACKAGE_INVALID:'Legacy DFU ZIP 호환성 검증 실패',DFU_START_BLOCKED:'DFU 시작 안전 조건 불충족',DFU_FAILED:'BLE DFU 전송 실패',DFU_VERSION_MISMATCH:'재연결된 센서의 대상/버전 불일치',VERSION_MISMATCH:'장치가 보고한 설치 버전 불일치',BOOT_INTERRUPTED:'업데이트 중 재부팅 또는 기존 슬롯으로 복구됨',NVS_WRITE:'명령 실행 기록 저장 실패',UPDATE_TIMEOUT:'업데이트 전체 시간 초과',WAIT_SENSOR:'페어링된 센서 재연결 대기',PAIRED_SENSOR_UNAVAILABLE:'센서 재연결 시간 초과',REMOTE_STATE_UNAVAILABLE:'클라우드 업데이트 상태 조회 실패'};return (reasons[code]||code)+(reasons[code]?' ('+code+')':'');}
function loadRemoteCatalog(id){
 const token=document.getElementById('remoteToken').value;
 el(id,'remoteMessage').textContent='패키지 목록 확인 중';
 google.script.run.withSuccessHandler(list=>{
  remoteCatalog.set(id,list);const select=el(id,'remoteRelease');select.innerHTML='';
  for(const item of list){const option=document.createElement('option');option.value=item.id;option.textContent=item.kind+' · '+item.version+' · '+item.bytes+' bytes'+(item.remote_capable===false?' · 원격 미지원 대상':'');select.appendChild(option);}
  el(id,'remoteMessage').textContent=list.length?'패키지를 선택한 뒤 업데이트를 승인하세요.':'등록된 원격 패키지가 없습니다.';pollDevice(id);
 }).withFailureHandler(e=>{el(id,'remoteMessage').textContent=String(e.message||e);}).getRemoteUpdateCatalog(token);
}
function approveRemoteUpdate(id){
 const release=(remoteCatalog.get(id)||[]).find(x=>x.id===el(id,'remoteRelease').value);if(!release)return;
 const rollback=el(id,'remoteRollback').checked;
 if(!confirm('장치 '+id+'\n'+release.kind+' '+release.version+' / build '+release.build+'\nSHA-256: '+release.sha256+'\n측정이 일시 중지됩니다. '+(rollback?'이전 ESP32 버전 복구도 승인합니다. ':'')+(release.remote_capable===false?'이 대상은 설치 후 원격 제어/결과 보고가 불가능할 수 있습니다. ':'')+'업데이트를 승인하시겠습니까?'))return;
 const bytes=crypto.getRandomValues(new Uint8Array(16)),approval=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');
 el(id,'remoteStart').disabled=true;
 google.script.run.withSuccessHandler(()=>{el(id,'remoteMessage').textContent='명령을 예약했습니다. 다운로드 완료만으로 성공 처리하지 않습니다.';pollDevice(id);})
  .withFailureHandler(e=>{el(id,'remoteMessage').textContent=String(e.message||e);pollDevice(id);})
  .queueRemoteUpdate(id,release.id,rollback,approval,Date.now(),document.getElementById('remoteToken').value);
}
function pollDevice(id){if(polling.has(id)||Date.now()<(pollFailures.get(id)?.at||0))return;polling.add(id);google.script.run.withSuccessHandler(d=>{polling.delete(id);pollFailures.delete(id);if(panels.has(id))show(id,d);}).withFailureHandler(e=>{polling.delete(id);const n=(pollFailures.get(id)?.n||0)+1;pollFailures.set(id,{n,at:Date.now()+Math.min(60000,5000*2**Math.min(n,4))});if(panels.has(id)){el(id,'state').textContent='CLOUD/UPLOAD ERROR (dashboard request)';el(id,'message').textContent=String(e.message||e);el(id,'message').className='error';}}).getDashboard(id);}
function poll(){if(deviceListBusy||Date.now()<listRetryAt)return;deviceListBusy=true;
 const fail=e=>{deviceListBusy=false;listFailures++;listRetryAt=Date.now()+Math.min(60000,5000*2**Math.min(listFailures,4));deviceError('CLOUD ERROR: '+String(e&&e.message||e));};
 try{google.script.run.withSuccessHandler(list=>{deviceListBusy=false;listFailures=0;listRetryAt=0;renderDevices(list);}).withFailureHandler(fail).getDashboardDevices();}catch(e){fail(e);}}
function control(id,start){const runner=google.script.run.withSuccessHandler(()=>{el(id,'message').textContent=start?'새 실험을 시작했습니다.':'실험을 종료했습니다.';el(id,'message').className='';pollDevice(id);}).withFailureHandler(e=>{el(id,'message').textContent=String(e.message||e);el(id,'message').className='error';});
 if(start)runner.startRecording(el(id,'label').value,id);else runner.stopRecording(id);}
setTimeout(()=>{if(document.getElementById('loading').textContent==='Loading devices…')deviceError('Device lookup is taking longer than expected; check Apps Script execution log and browser console');},20000);
restoreRemoteToken();setInterval(poll,refreshMs);poll();
</script></body></html>
